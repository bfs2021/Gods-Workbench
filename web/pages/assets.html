      #assetVaultSidebar .gw-side-bus-header { width: auto; flex: 0 0 auto; display: flex !important; align-items: center; padding: 6px; border-right: 1px solid rgb(255 255 255 / .08); border-bottom: 0 !important; }
      #assetSidebarCreate { width: auto !important; min-height: 32px; padding: 0 9px; white-space: nowrap; }
      #assetCategories { min-width: 0; min-height: 0; flex: 1 1 auto !important; flex-direction: row !important; overflow-x: auto !important; overflow-y: hidden !important; padding: 8px !important; }
      .asset-shell-nav-button { width: auto; min-width: 116px; flex: 0 0 auto; }
      .asset-shell-sidebar-actions { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 6px; border-top: 0; border-left: 1px solid rgb(255 255 255 / .08); }
      .asset-shell-sidebar-actions .hw-btn { width: auto !important; min-height: 32px; padding: 0 8px; white-space: nowrap; }

    }

<body class="gw-shell bg-[#090a0d] text-slate-200 antialiased h-screen flex flex-col justify-between select-none overflow-hidden px-5 gw-type-body-md">

  <header class="h-[116px] topbar-master-deck border-b border-white/10 px-3 flex flex-col justify-between shrink-0 z-40 relative select-none overflow-hidden py-2" style="min-height: 116px;">
    <div class="absolute inset-0 pointer-events-none z-10 oled-ambient-pixel"></div>
    <div class="absolute inset-0 pointer-events-none z-20 bg-gradient-to-b from-white/[0.07] via-transparent to-black/80"></div>

    <div class="master-deck-upper flex items-center justify-between relative z-30 px-1 pt-0.5">

        </div>
        <div class="flex items-center space-x-1.5 px-2 py-0.5 rounded-md bg-[#0a0c10] border border-white/10 shadow-inner">

        </div>
      </div>

      <div class="flex items-center space-x-2 shrink-0">
        <div class="flex items-center space-x-1.5 bg-[#07080b] px-3 py-1 rounded-lg border border-white/10 shadow-inner">
          <button class="hw-btn hw-btn-icon transition"><i data-lucide="chevron-left" class="w-3.5 h-3.5"></i></button>
          <div class="flex items-center space-x-2 px-1.5 min-w-0">

            <span class="gw-type-body-sm font-mono font-bold text-[#eddab3]">ASSET VAULT</span>

          </div>
          <button class="hw-btn hw-btn-icon transition"><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
        </div>
      </div>

      <div class="flex items-center space-x-2 shrink-0">
        <div class="trapezoid-uv-housing mr-1.5" title="RAM 内存监视表">

          <svg class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 148 48">
            <path d="M 146 8 A 6 6 0 0 0 140 2 L 14 2 A 4 4 0 0 0 10 5 L 2 43 A 4 4 0 0 0 6 47 L 140 47 A 6 6 0 0 0 146 41 Z"

            <path d="M 48.32 39.66 A 27 27 0 0 1 99.68 39.66" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8" />

            <polygon id="svgNeedleRAM" points="73.3,48 74.7,48 74.3,19 73.7,19" fill="#ffffff" filter="drop-shadow(0 0 2.5px #38bdf8)" transform="rotate(25.9 74 48)" />
          </svg>
          <div class="uv-bottom-hub">
            <span class="uv-hub-percent text-cyan-300" id="ramValText">未接入</span>
          </div>
        </div>

        <div class="flex items-center space-x-1 bg-[#090b0e] p-1 rounded-lg border border-white/5">
          <button class="hw-round-btn w-7 h-7" title="停止"><div class="hw-round-inner w-4 h-4"><div class="w-1.5 h-1.5 bg-slate-400 rounded-sm"></div></div></button>
          <button class="hw-round-btn active w-7 h-7" title="运行"><div class="hw-round-inner w-4 h-4"><svg class="w-2.5 h-2.5 text-[#dfc384]" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div></button>
          <button class="hw-round-btn w-7 h-7" title="下一步"><div class="hw-round-inner w-4 h-4"><i data-lucide="skip-forward" class="w-2.5 h-2.5 text-slate-400"></i></div></button>
        </div>

        <div class="h-4 w-px bg-white/10"></div>
        <div class="px-2.5 py-1.5 rounded bg-[#06070a] border border-[#dfc384]/30 font-mono gw-type-body-sm text-[#eddab3] font-bold shadow-inner flex items-center space-x-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-[#dfc384] shadow-[0_0_6px_#dfc384]"></span>
          <span id="masterDeckClock">00:00:00</span>
        </div>
        <button type="button" id="masterDeckDate" class="hw-btn shrink-0 min-w-[76px]" title="打开项目排期日历" aria-label="打开项目排期日历"><i data-lucide="calendar-days" class="w-3.5 h-3.5 text-[#dfc384]" aria-hidden="true"></i><span class="text-slate-500" id="masterDeckDateMonth">---</span><span id="masterDeckDateDay">--</span></button>
      </div>
    </div>

    <div class="recessed-deck-slot h-11 rounded-lg flex items-center justify-between px-2.5 relative z-30">
      <div class="flex items-center space-x-2 shrink-0" id="navPillsGroup">
                <a href="index.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="首页 · 控制台">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>首页 · 控制台</span>
        </a>
        <a href="projects.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="项目中心">

          <span>项目中心</span>
        </a>
        <a href="production.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="剧集制片">
          <i data-lucide="clapperboard" class="w-3.5 h-3.5"></i>
          <span>剧集制片</span>
        </a>
        <a href="agents.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="智能体">

          <span>智能体</span>
        </a>
        <a href="storyboard.html?view=canvas" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="画布">

        <a href="assets.html" class="pill-capsule-active px-3.5 py-1.5 gw-type-body-sm flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="资产库">
          <i data-lucide="database" class="w-3.5 h-3.5"></i>
          <span>资产库</span>
        </a>
        <a href="collab.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="协作">
          <i data-lucide="users" class="w-3.5 h-3.5"></i>
          <span>协作</span>
        </a>
        <a href="workflow.html" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="工作流">

        <a href="index.html?view=settings" class="pill-capsule-inactive px-3.5 py-1.5 gw-type-body-sm font-medium flex items-center space-x-1.5 nav-pill-btn cursor-pointer" title="系统设置">

            <div class="hw-fader-thumb-3d" style="left: 0%;"></div>
          </div>

          <div class="hw-fader-track-horizontal w-24">
            <div class="hw-fader-glow-bar" style="width: 0%; background: linear-gradient(90deg, #38bdf8 0%, #2dd4bf 100%);"></div>
            <div class="hw-fader-thumb-3d" style="left: 0%;"></div>
          </div>
          <span class="gw-type-body-sm font-mono text-amber-300 font-bold" id="bufferReadout" data-gw-degradation="not_integrated" title="真实数据源：GET /api/observability/health">未接入</span>
        </div>
      </div>

      <div class="flex items-center space-x-3 shrink-0">

          <span class="gw-type-body-sm font-mono text-slate-400 font-bold">AUTO</span>
          <button type="button" class="hw-slide-toggle active" aria-pressed="true" aria-label="切换自动与手动模式" onclick="this.classList.toggle('active'); this.setAttribute('aria-pressed', String(this.classList.contains('active')))"><div class="hw-slide-peg"></div></button>
          <span class="gw-type-body-sm font-mono text-[#dfc384] font-bold">MANUAL</span>
        </div>
        <div class="h-3.5 w-px bg-white/10"></div>

        <div class="hw-avatar-keycap ml-1 cursor-pointer hover:scale-105 active:scale-95 transition" title="认证状态未接入：点击打开认证中心查看真实登录状态" data-gw-identity="unverified">
          <div class="hw-avatar-keycap-inner">
            <i data-lucide="shield-check" class="w-4 h-4 text-[#eddab3]"></i>
          </div>
          <span class="hw-avatar-keycap-status"></span>
        </div>

  <div class="asset-shell-workspace flex-1 flex overflow-hidden min-h-0">
    <!-- 左侧资源库看板导航 -->
    <aside id="assetVaultSidebar" class="gw-side-bus-unified w-64 bg-[#08090d] border-r border-[#191c24] flex flex-col shrink-0 z-30 h-full min-h-0">
      <div class="gw-side-bus-header p-2 border-b border-white/5 shrink-0">
        <button type="button" id="assetSidebarCreate" class="hw-btn w-full flex items-center justify-center space-x-1" onclick="WorkbenchAssets.openCreateAssetLibrary()" title="新建资源库" aria-label="新建资源库" aria-haspopup="dialog">
          <i data-lucide="plus" class="w-3.5 h-3.5 text-[#dfc384]" aria-hidden="true"></i>
          <span>新建资源</span>
        </button>
      </div>

      <div class="gw-side-bus-list flex-1 overflow-y-auto p-2 space-y-1.5 gw-type-body-sm" id="assetCategories" role="tablist" aria-label="资源库导航">
        <!-- 动态生成 -->
      </div>

      <div class="asset-shell-sidebar-actions shrink-0 space-y-1.5">
        <button type="button" id="btnUnassignedInbox" class="hw-btn w-full flex items-center justify-center space-x-1" style="display:none" onclick="GWUnassignedInbox.open()" title="尚未归属任何项目的资产（仅本人可见）">
          <i data-lucide="inbox" class="w-3.5 h-3.5 text-[#dfc384]"></i>
          <span>未归属</span><span class="font-mono text-[#dfc384]" data-unassigned-count></span>

        <button type="button" id="assetSidebarSmartFilter" class="hw-btn w-full flex items-center justify-center space-x-1" onclick="WorkbenchAssets.toggleSmartFilter()" title="打开或关闭智能筛选" aria-label="智能筛选" aria-controls="registryFacetPopover">
          <i data-lucide="filter" class="w-3.5 h-3.5 text-[#dfc384]"></i>
          <span>智能筛选</span>
        </button>
        <button type="button" class="hw-btn hw-btn-gold w-full flex items-center justify-center space-x-1" onclick="WorkbenchAssets.uploadAsset()" title="导入外部资产文件" aria-label="导入外部资产文件">
          <i data-lucide="cloud-upload" class="w-3.5 h-3.5 text-[#dfc384]"></i>
          <span>导入外部资产文件</span>
        </button>
        <button type="button" id="assetSidebarSettings" class="hw-btn w-full flex items-center justify-center space-x-1" onclick="WorkbenchAssets.openAssetSettings()" title="打开资产库设置">
          <i data-lucide="settings-2" class="w-3.5 h-3.5 text-[#dfc384]"></i>
          <span>资产设置</span>
        </button>
      </div>
    </aside>

    <!-- MAIN: 资产金库网格与详情 -->
    <main id="assetVaultStage">
      <iframe id="assetVaultFrame" title="资产库" data-src="/static/asset-manager.html?embedded=1&amp;vault=1"></iframe>
    </main>
  </div>
