# -*- coding: utf-8 -*-
# Phase 12 A4 媒体处理与缩略图洁净室接口目录
meta:
  version: p12-a4-1
  distribution: NOT AUTHORIZED FOR PUBLIC DISTRIBUTION
  data_policy: "仅在允许根目录内读取真实文件；真实执行 PIL 缩略图与 ffmpeg 波形/转码；远端抓取做 s3rver-side req forgery 防护。"
  auth: {unauthorized: 401, readonly_write: 403, not_found: 404, invalid_request: 400, payload_too_large: 413}
  path_policy: "本机文件必须经 resolve_within_roots()；未配置 GW_ALLOWED_ROOTS 一律 403 LOCAL_FILE_ACCESS_NOT_ADMITTED；源文件只回显 relative_display()，输出使用相对 GW_DATA_DIR 的完整路径供下载。"
  fail_closed: "ffmpeg/PIL/httpx 缺失或异常 → 503，data_status=not_integrated，绝不伪造。"
  output_policy: "输出落盘于 GW_DATA_DIR/media_output/**；output 返回相对 GW_DATA_DIR 的完整路径，不是仅文件名；download-output仅允许OUTPUT-ACCESS-CONTRACT.md的四个产物命名空间，拒绝内部状态/绝对路径/链接。"
  cache_policy: "分镜按总时长九等分抽取固定 9 帧（首帧、尾帧与 7 个逐级二分中间帧），单帧宽度不超过 720，并由服务端按素材原画幅正常拼接为一张 3×3 单图 media_output/{cache_folder}/storyboards/{asset_id}/storyboard.jpg（3 列 × 3 行直接拼接，不补边、不拉伸，画幅随源视频走；JPEG），与缩略图共用 cache_folder 口径；中间帧仅作合成输入，合成成功后立即按精确帧名删除，仅保留被 metadata.video_segments[].thumbnail 引用的帧，接口 frames 恒为空数组并回报 frames_removed；前端在固定 16:9 小窗内以 object-fit:contain 等比适配整图，裁切只发生在展示层，不落到产物；旧版固定根 media_output/storyboards/{asset_id}/ 只读与删除兼容，不再写入。分镜生成命中合成单图即短路复用（存在、非空、画幅与源视频一致且不早于源视频 mtime），不再重复抽帧，force=true 强制重算；片段缩略图取视频段中点帧，成功后把相对 GW_DATA_DIR 的真实路径回写 metadata.video_segments[].thumbnail；任一片段抽帧失败整体失败关闭，注册表保持原值。删除分镜缓存同时清空对应 thumbnail 字段，全部产物（含合成单图）清空后把 features.video_storyboard 置假。定向删除只匹配精确ID目录和生成名。缩略图缓存位置由唯一入口 resolve_cache_directory() 决定（生成/预览/删除共用，不得各自推导）：mode=source 写入 media_output/{cache_folder}/{root_bucket}/{asset_id}.jpg.png，root_bucket 为素材源根身份；mode=custom 真实写入 <所选目录>/{cache_folder}/{asset_id}.jpg.png，所选目录必须在允许根内，否则 403 CACHE_DIRECTORY_NOT_ALLOWED（未配置允许根同样返回该码，不回显原始路径）且磁盘零写入、不静默回退 source；落盘目录创建后复检重解析点，Junction/符号链接指向根外一律拒绝；cache_folder 默认 god-cache 且必须是单段安全 ASCII；无 asset_id 时文件名为 media-身份摘要-w宽度.jpg.png。缓存绝不写入素材源目录：source 模式只写受管产物目录，custom 模式只写允许根内的所选目录。命中复用按源文件 mtime 判定，replace_existing=true 强制重算。批量接口接受 asset_ids 数组并逐项返回 generated/cached/failed；单项失败不中断整批，单条失败保持原错误语义。所有组件拒绝链接/Junction，删除先预检并扫描精确文件名，部分失败如实返回，旧混用frame保留并明示legacy_shared_frames_preserved。预览优先命中缓存：/api/media-preview 依次查找 <key>-w宽度-源身份摘要.jpg.png（视频为 .frame.jpg，源身份=size+mtime_ns）、预生成缩略图 <asset_id>.jpg.png（须像素宽度一致且新鲜），未命中才实时重算并原子落盘；同素材同宽度的旧源身份缓存写入后清理。缓存目录不可解析、磁盘错误或缓存文件损坏时降级实时生成，不改变 Content-Type 与浏览器缓存策略；删除缩略图缓存同时清理该素材的预览派生缓存；删除按当前模式解析出的目录精确匹配文件名，切换模式后不误删另一根下的同名产物。"
  job_policy: "generate-background 与 generate-storyboards 真实执行后分别返回稳定 tjob_NNNN / sjob_NNNN 与 poll_hint=/api/asset-thumbnails/jobs/{job_id}，状态、progress 真实计数落盘可回读；不做假进度。"
  ssrf_policy: "远端 URL 只接受 http/https；拒绝内网/回环/链路本地/保留网段；GET 不跟随重定向且不使用环境代理；URL禁止凭据；仅接受2xx响应，分块读取期间执行16MB上限。本地协议夹具保留127.0.0.1/localhost准入，不宣称生产网络完整隔离。"
interfaces:
  - {name: get_asset_proxy_settings, method: GET, path: /api/asset-proxy/settings}
  - {name: patch_asset_proxy_settings, method: PATCH, path: /api/asset-proxy/settings}
  - {name: get_asset_thumbnail_settings, method: GET, path: /api/asset-thumbnails/settings}
  - {name: patch_asset_thumbnail_settings, method: PATCH, path: /api/asset-thumbnails/settings}
  - {name: post_asset_thumbnail_delete, method: POST, path: /api/asset-thumbnails/delete}
  - {name: post_asset_thumbnail_delete_storyboards, method: POST, path: /api/asset-thumbnails/delete-storyboards}
  - {name: post_asset_thumbnail_generate, method: POST, path: /api/asset-thumbnails/generate}
  - {name: post_asset_thumbnail_generate_background, method: POST, path: /api/asset-thumbnails/generate-background}
  - {name: post_asset_thumbnail_generate_storyboards, method: POST, path: /api/asset-thumbnails/generate-storyboards}
  - {name: get_asset_thumbnail_job, method: GET, path: /api/asset-thumbnails/jobs/{p}}
  - {name: get_audio_waveform_data, method: GET, path: /api/audio-waveform-data}
  - {name: get_download_output, method: GET, path: /api/download-output}
  - {name: get_media_preview, method: GET, path: /api/media-preview}
  - {name: get_media_transcode, method: GET, path: /api/media-transcode}
  - {name: post_online_image, method: POST, path: /api/online-image}
